<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcelo Alonso — CV</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f5f4f0;color:#1a1a1a;padding:1.5rem 1rem;}
.cv{max-width:820px;margin:0 auto;background:#fff;border-radius:16px;padding:2.5rem;box-shadow:0 4px 40px rgba(0,0,0,0.08);}
.download-bar{display:flex;justify-content:flex-end;margin-bottom:1.5rem;}
.btn-download{display:inline-flex;align-items:center;gap:8px;background:#185FA5;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:8px 18px;border-radius:20px;text-decoration:none;transition:background 0.2s;}
.btn-download:hover{background:#0e4a82;}
.btn-download svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hero{padding-bottom:1.75rem;border-bottom:1px solid #e8e5de;margin-bottom:1.75rem;}
.hero-top{display:flex;align-items:center;gap:1.25rem;margin-bottom:1.25rem;}
.avatar-img{width:120px;height:120px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid #E6F1FB;}
.hero-info{flex:1;min-width:0;}
.title-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:0.07em;color:#185FA5;background:#E6F1FB;padding:3px 12px;border-radius:20px;margin-bottom:8px;}
.name{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:#111;line-height:1.1;}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.badge{font-size:11px;padding:3px 11px;border-radius:20px;border:0.5px solid #ccc;color:#555;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:#f5f4f0;border-radius:12px;padding:1rem 0.5rem;text-align:center;}
.stat-n{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#111;line-height:1;}
.stat-l{font-size:10px;color:#777;margin-top:5px;line-height:1.4;}
.contact-bar{display:flex;flex-wrap:nowrap;align-items:center;gap:0;margin-bottom:1.75rem;padding:0.6rem 0.75rem;background:#f5f4f0;border-radius:10px;font-size:11px;color:#555;}
.contact-item{display:flex;align-items:center;gap:4px;flex:1;min-width:0;white-space:nowrap;}
.contact-item+.contact-item{border-left:1px solid #ddd;padding-left:10px;margin-left:4px;}
.contact-item a{color:#185FA5;text-decoration:none;} 
.ci{width:11px;height:11px;fill:none;stroke:#185FA5;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.ci-fill{width:11px;height:11px;flex-shrink:0;}
.section{margin-bottom:2rem;}
.section-label{font-size:10px;font-weight:500;letter-spacing:0.12em;color:#185FA5;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:0.5px;background:#e0ddd6;}
.profile-box{background:#f5f4f0;border-radius:10px;padding:1rem 1.25rem;font-size:13px;color:#555;line-height:1.8;border-left:3px solid #185FA5;}
.timeline{position:relative;}
.timeline-item{display:flex;gap:0;align-items:stretch;}
.timeline-left{display:flex;flex-direction:column;align-items:center;min-width:48px;padding-top:12px;}
.timeline-year{font-size:10px;font-weight:600;color:#185FA5;text-align:center;line-height:1.3;margin-bottom:4px;}
.timeline-dot{width:10px;height:10px;background:#185FA5;border-radius:50%;flex-shrink:0;border:2px solid #fff;outline:2px solid #185FA5;}
.timeline-line{flex:1;width:2px;background:#e0ddd6;margin-top:3px;min-height:16px;}
.timeline-card{flex:1;background:#fff;border:0.5px solid #e0ddd6;border-radius:10px;padding:0.7rem 0.9rem;margin:4px 0 4px 12px;display:flex;gap:10px;align-items:center;}
.tl-logo{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden;background:#f5f4f0;}
.tl-logo img{width:36px;height:36px;object-fit:contain;}
.tl-body{flex:1;}
.edu-name{font-size:12px;font-weight:500;color:#111;margin-bottom:2px;}
.edu-inst{font-size:11px;color:#888;}
.edu-badge-green{display:inline-block;font-size:10px;color:#2d7a2d;background:#e8f5e8;padding:2px 8px;border-radius:10px;border:0.5px solid #a8d5a8;}
.edu-item{display:flex;align-items:center;gap:14px;padding:0.8rem 1rem;border-radius:10px;border:0.5px solid #e0ddd6;background:#fff;}
.edu-logo{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;background:#f5f4f0;}
.edu-logo img{width:44px;height:44px;object-fit:contain;}
.edu-body{flex:1;}
.exp-timeline .timeline-left{min-width:52px;padding-top:16px;}
.exp-timeline .timeline-year{font-size:9px;}
.exp-timeline .timeline-card{flex-direction:column;align-items:stretch;padding:0.9rem 1rem;margin:6px 0 6px 12px;}
.exp-card-header{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.exp-logo{width:44px;height:44px;flex-shrink:0;border-radius:8px;overflow:hidden;background:#f5f4f0;display:flex;align-items:center;justify-content:center;}
.exp-logo img{width:44px;height:44px;object-fit:contain;}
.exp-card-titles{flex:1;}
.job-title{font-weight:500;font-size:14px;color:#111;margin-bottom:2px;}
.job-company{font-size:12px;color:#888;font-style:italic;}
.job-items{list-style:none;font-size:12px;color:#555;line-height:1.7;}
.job-items li{display:flex;gap:7px;margin-bottom:2px;}
.job-items li::before{content:'→';color:#185FA5;flex-shrink:0;font-size:10px;margin-top:3px;}
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.skill-card{background:#f5f4f0;border-radius:10px;padding:0.85rem 1rem;}
.skill-card-title{font-size:12px;font-weight:500;color:#111;margin-bottom:8px;}
.skill-tags{display:flex;flex-wrap:wrap;gap:5px;}
.skill-tag{font-size:10px;padding:2px 8px;border-radius:8px;background:#fff;border:0.5px solid #ccc;color:#555;}
@media(max-width:600px){.cv{padding:1.5rem 1.25rem;}.name{font-size:26px;}.stats-grid{gap:6px;}.stat{padding:0.75rem 0.25rem;}.stat-n{font-size:20px;}.stat-l{font-size:9px;}.skills-grid{grid-template-columns:1fr;}.avatar-img{width:60px;height:60px;}.contact-bar{flex-wrap:wrap;font-size:10px;}}
@media print{body{background:#fff;padding:0;}.cv{box-shadow:none;border-radius:0;padding:1.5rem;}.download-bar{display:none;}}
</style>
</head>
